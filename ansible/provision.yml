---
- name: Configure App VM
  hosts: app
  become: true

  vars:
    app_dir: /opt/app
    app_user: appuser
    node_version: "24"
    app_port: 8080
    frontend_port: 5173
    backend_port: 3000

  tasks:

    # --- System Updates ---
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install essential system packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - build-essential
          - libssl-dev
          - libpq-dev
          - python3
          - python3-pip
        state: present

    # --- Docker Setup ---
    - name: Add Docker's official GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_facts['lsb']['codename'] }} stable"
        state: present

    - name: Install Docker packages
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: yes

    - name: Install Docker Compose plugin
      apt:
        name: docker-compose-plugin
        state: present

    - name: Ensure Docker is started and enabled
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Configure Docker daemon logging
      copy:
        content: |
          {
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "10m",
              "max-file": "3"
            }
          }
        dest: /etc/docker/daemon.json
        mode: '0644'
      notify: Restart Docker

    # --- Nginx Setup ---
    - name: Install Nginx
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Remove default Nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload Nginx

    - name: Create Nginx configuration directory
      file:
        path: /etc/nginx/conf.d
        state: directory
        mode: '0755'

    - name: Configure Nginx as reverse proxy for Docker containers
      copy:
        content: |
          upstream frontend {
              server 127.0.0.1:{{ frontend_port }};
          }

          upstream backend {
              server 127.0.0.1:{{ backend_port }};
          }

          server {
              listen 80;
              server_name _;

              # Security headers
              add_header X-Frame-Options "SAMEORIGIN" always;
              add_header X-Content-Type-Options "nosniff" always;
              add_header X-XSS-Protection "1; mode=block" always;

              # Frontend - serve on root path
              location / {
                  proxy_pass http://frontend;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $host;
                  proxy_cache_bypass $http_upgrade;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  
                  # WebSocket support for Vite HMR
                  proxy_read_timeout 86400;
              }

              # Backend API - serve on /api path
              location /api/ {
                  proxy_pass http://backend/api/;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  
                  # Increase timeouts for long-running requests
                  proxy_read_timeout 300;
                  proxy_connect_timeout 300;
                  proxy_send_timeout 300;
              }

              # Health check endpoint for load balancer
              location /health {
                  access_log off;
                  return 200 "healthy\n";
                  add_header Content-Type text/plain;
              }

              # Additional health check that validates backend
              location /api/health {
                  proxy_pass http://backend/api/health;
                  access_log off;
              }
          }
        dest: /etc/nginx/conf.d/app.conf
        mode: '0644'
      notify: Reload Nginx

    - name: Test Nginx configuration
      command: nginx -t
      register: nginx_test
      changed_when: false

    - name: Ensure Nginx is started and enabled
      systemd:
        name: nginx
        state: started
        enabled: true

    # --- Node.js Setup (optional - only needed if running Node outside Docker) ---
    - name: Add NodeSource repository
      shell: curl -fsSL https://deb.nodesource.com/setup_{{ node_version }}.x | bash -
      args:
        executable: /bin/bash
        creates: /etc/apt/sources.list.d/nodesource.list

    - name: Install Node.js
      apt:
        name: nodejs
        state: present
        update_cache: yes

    # --- App User & Directory ---
    - name: Create app user
      user:
        name: "{{ app_user }}"
        groups: docker
        append: yes
        create_home: yes
        shell: /bin/bash

    - name: Create app directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0755'

    # --- Python packages for Ansible Docker modules ---
    - name: Install Python Docker SDK
      pip:
        name:
          - docker
          - docker-compose
        state: present

    # --- Firewall Setup ---
    - name: Check if ufw is installed
      command: which ufw
      register: ufw_check
      failed_when: false
      changed_when: false

    - name: Allow SSH through firewall
      ufw:
        rule: allow
        port: '22'
        proto: tcp
      when: ufw_check.rc == 0

    - name: Allow HTTP through firewall
      ufw:
        rule: allow
        port: '80'
        proto: tcp
      when: ufw_check.rc == 0

    - name: Allow HTTPS through firewall
      ufw:
        rule: allow
        port: '443'
        proto: tcp
      when: ufw_check.rc == 0

    # Note: Backend and frontend ports (3000, 5173) are NOT exposed to the internet
    # They're only accessible via Nginx reverse proxy on localhost

    - name: Enable ufw
      ufw:
        state: enabled
      when: ufw_check.rc == 0

  handlers:
    - name: Restart Docker
      systemd:
        name: docker
        state: restarted

    - name: Reload Nginx
      systemd:
        name: nginx
        state: reloaded