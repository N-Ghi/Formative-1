---
- name: Deploy application to production
  hosts: app
  become: yes
  
  vars:
    app_dir: /opt/app
    compose_file: "{{ app_dir }}/docker-compose.yml"
    registry_url: "{{ registry_url }}"
    registry_username: "{{ registry_username }}"
    registry_password: "{{ registry_password }}"
    image_name: "{{ image_name }}"
    image_tag: "{{ image_tag | default('latest') }}"
  
  tasks:
    - name: Ensure app directory exists
      file:
        path: "{{ app_dir }}"
        state: directory
        mode: '0755'
    
    - name: Copy docker-compose file to server
      template:
        src: docker-compose.yml.j2
        dest: "{{ compose_file }}"
        mode: '0644'
    
    - name: Copy backend environment file (if exists)
      copy:
        src: ../backend/.env.production
        dest: "{{ app_dir }}/.env.backend"
        mode: '0600'
      ignore_errors: yes
    
    - name: Copy frontend environment file (if exists)
      copy:
        src: ../frontend/.env.production
        dest: "{{ app_dir }}/.env.frontend"
        mode: '0600'
      ignore_errors: yes
    
    - name: Log in to container registry
      shell: |
        echo "{{ registry_password }}" | docker login {{ registry_url }} -u "{{ registry_username }}" --password-stdin
      no_log: true
      register: docker_login
      changed_when: false
      failed_when: docker_login.rc != 0
    
    - name: Pull backend image
      command: docker pull {{ registry_url }}/{{ image_name }}-backend:{{ image_tag }}
      register: pull_backend
      changed_when: "'Downloaded newer image' in pull_backend.stdout or 'Status: Downloaded' in pull_backend.stdout"
    
    - name: Pull frontend image
      command: docker pull {{ registry_url }}/{{ image_name }}-frontend:{{ image_tag }}
      register: pull_frontend
      changed_when: "'Downloaded newer image' in pull_frontend.stdout or 'Status: Downloaded' in pull_frontend.stdout"
    
    - name: Stop and remove old containers
      command: docker compose -f {{ compose_file }} down
      args:
        chdir: "{{ app_dir }}"
      ignore_errors: yes
    
    - name: Start application with docker-compose
      command: docker compose -f {{ compose_file }} up -d
      args:
        chdir: "{{ app_dir }}"
      register: compose_up
    
    - name: Wait for backend to be healthy (direct check)
      uri:
        url: "http://localhost:3000/api/docs"
        status_code: 200
      register: backend_health
      until: backend_health.status == 200
      retries: 10
      delay: 5
      ignore_errors: yes
    
    - name: Wait for frontend to be healthy (direct check)
      uri:
        url: "http://localhost:5173"
        status_code: 200
      register: frontend_health
      until: frontend_health.status == 200
      retries: 10
      delay: 5
      ignore_errors: yes
    
    - name: Reload Nginx to ensure it's using updated containers
      systemd:
        name: nginx
        state: reloaded
      ignore_errors: yes
    
    - name: Wait for Nginx to be ready
      pause:
        seconds: 3
    
    - name: Health check through Nginx (public endpoint)
      uri:
        url: "http://localhost/api/docs"
        status_code: 200
      register: nginx_backend_health
      until: nginx_backend_health.status == 200
      retries: 5
      delay: 3
      ignore_errors: yes
    
    - name: Health check frontend through Nginx
      uri:
        url: "http://localhost/"
        status_code: 200
      register: nginx_frontend_health
      until: nginx_frontend_health.status == 200
      retries: 5
      delay: 3
      ignore_errors: yes
    
    - name: Verify containers are running
      command: >
        docker ps --format "{{ '{{' }}.Names{{ '}}' }}: {{ '{{' }}.Status{{ '}}' }}"
      register: container_status
      changed_when: false
    
    - name: Show deployment status
      debug:
        msg: 
          - "Deployment completed!"
          - "Containers: {{ container_status.stdout_lines }}"
          - "Backend health (direct): {{ 'OK' if backend_health.status == 200 else 'FAILED' }}"
          - "Frontend health (direct): {{ 'OK' if frontend_health.status == 200 else 'FAILED' }}"
          - "Backend health (via Nginx): {{ 'OK' if nginx_backend_health.status == 200 else 'FAILED' }}"
          - "Frontend health (via Nginx): {{ 'OK' if nginx_frontend_health.status == 200 else 'FAILED' }}"
          - "Access your app at: http://<load-balancer-ip>/"
    
    - name: Clean up old Docker images
      shell: docker image prune -af
      register: prune_result
      changed_when: "'Total reclaimed space' in prune_result.stdout"
