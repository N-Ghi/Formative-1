name: Deploy to Production

on:
  push:
    branches:
      - main

env:
  REGISTRY_URL: summativeacr1234.azurecr.io
  IMAGE_NAME: inventorytracker
  
jobs:
  # Step 1: Run all CI checks
  ci-checks:
    name: Run CI Checks
    runs-on: ubuntu-latest
    
    # Add PostgreSQL service for tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Run backend linter
        working-directory: ./backend
        run: npm run lint
      
      - name: Run backend tests
        working-directory: ./backend
        env:
          NODE_ENV: test
          AZURE_DB_USER: postgres
          AZURE_DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          AZURE_DB_NAME: testdb
          AZURE_DB_HOST: localhost
          AZURE_DB_PORT: 5432
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}
        run: npm test
      
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Run frontend linter
        working-directory: ./frontend
        run: npm run lint
      
      - name: Run frontend tests
        working-directory: ./frontend
        env:
          VITE_API_URL: /api
        run: npm test

  # Step 2: Build and push Docker images
  build-and-push:
    name: Build and Push Docker Images
    needs: ci-checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx (stable builder name)
        uses: docker/setup-buildx-action@v3
        with:
          builder-name: prod-builder
          driver: docker-container
          install: true
      
      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          builder: prod-builder
          push: true
          tags: |
            ${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAME }}-backend:latest
            ${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          builder: prod-builder
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: |
            ${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAME }}-frontend:latest
            ${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Step 3: Deploy to production using Ansible
  deploy:
    name: Deploy to Production VM
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Ansible
        run: pip install ansible
      
      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts
      
      - name: Create Ansible inventory
        run: |
          cat > inventory.ini <<EOF
          [app]
          ${{ secrets.VM_HOST }} ansible_user=${{ secrets.VM_USER }} ansible_ssh_private_key_file=~/.ssh/id_rsa
          EOF
      
      - name: Run Ansible Playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: False
        run: |
          ansible-playbook -i inventory.ini ansible/deploy.yml \
            -e "registry_url=${{ env.REGISTRY_URL }}" \
            -e "registry_username=${{ secrets.REGISTRY_USERNAME }}" \
            -e "registry_password=${{ secrets.REGISTRY_PASSWORD }}" \
            -e "image_name=${{ env.IMAGE_NAME }}" \
            -e "image_tag=latest"
      
      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "docker ps --filter 'name=inventorytracker' --format 'table {{.Names}}\t{{.Status}}'"
