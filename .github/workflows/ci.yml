name: CI Pipeline

on:
  # Trigger on pushes to any branch except main
  push:
    branches-ignore:
      - main
  
  # Trigger on pull requests targeting main
  pull_request:
    branches:
      - main

# Permissions required for SARIF uploads to GitHub Security tab
permissions:
  contents: read
  security-events: write

jobs:
  # Backend CI Job
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend
    
    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2. Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci
      
      # 4. Run linting (fail on errors)
      - name: Run linting
        run: npm run lint
      
      # 5. Run tests (with environment variables)
      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          AZURE_DB_USER: ${{ secrets.AZURE_DB_USER }}
          AZURE_DB_PASSWORD: ${{ secrets.AZURE_DB_PASSWORD }}
          AZURE_DB_NAME: ${{ secrets.AZURE_DB_NAME }}
          AZURE_DB_HOST: ${{ secrets.AZURE_DB_HOST }}
          AZURE_DB_PORT: ${{ secrets.AZURE_DB_PORT }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}

      # 6. Set up environment variables for Docker build
      - name: Set up environment variables
        run: |
          echo "JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "FRONTEND_URL=${{ secrets.FRONTEND_URL }}" >> .env
          echo "SEED_PASSWORD=${{ secrets.SEED_PASSWORD }}" >> .env
          echo "PORT=${{ secrets.PORT }}" >> .env
          echo "AZURE_DB_HOST=${{ secrets.AZURE_DB_HOST }}" >> .env
          echo "AZURE_DB_PORT=${{ secrets.AZURE_DB_PORT }}" >> .env
          echo "AZURE_DB_NAME=${{ secrets.AZURE_DB_NAME }}" >> .env
          echo "AZURE_DB_USER=${{ secrets.AZURE_DB_USER }}" >> .env
          echo "AZURE_DB_PASSWORD=${{ secrets.AZURE_DB_PASSWORD }}" >> .env
      
      # 7. Build Docker image
      - name: Build Backend Docker image
        run: docker build -t inventory-backend:${{ github.sha }} .
        working-directory: ./backend

      # 8. Scan Docker image for vulnerabilities with Trivy
      - name: Run Trivy vulnerability scanner on Backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'inventory-backend:${{ github.sha }}'
          format: 'sarif'
          output: '../trivy-results-backend.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          fail-on: 'CRITICAL'
      
      # 9. Upload Trivy results to GitHub Security tab
      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results-backend.sarif'
          category: 'backend-container-scan'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Frontend CI Job
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2. Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci
      
      # 4. Run linting (fail on errors)
      - name: Run linting
        run: npm run lint
      
      # 5. Run tests (fail if tests fail)
      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
      
      # 6. Set up environment variables
      - name: Set up environment variables
        run: |
          echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" >> .env
      
      # 7. Build application
      - name: Build application
        run: npm run build
      
      # 8. Build Docker image
      - name: Build Frontend Docker image
        run: docker build -t inventory-frontend:${{ github.sha }} .
        working-directory: ./frontend

      # 9. Scan Docker image for vulnerabilities with Trivy
      - name: Run Trivy vulnerability scanner on Frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'inventory-frontend:${{ github.sha }}'
          format: 'sarif'
          output: '../trivy-results-frontend.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          fail-on: 'CRITICAL'
      
      # 10. Upload Trivy results to GitHub Security tab
      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results-frontend.sarif'
          category: 'frontend-container-scan'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Infrastructure as Code Security Scanning Job
  iac-security-scan:
    name: Infrastructure as Code Security Scan
    runs-on: ubuntu-latest
    
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2. Install tfsec
      - name: Install tfsec
        run: |
          TFSEC_VERSION=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/aquasecurity/tfsec/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Installing tfsec version: $TFSEC_VERSION"
          wget -q -O tfsec.tar.gz "https://github.com/aquasecurity/tfsec/releases/download/${TFSEC_VERSION}/tfsec_${TFSEC_VERSION#v}_linux_amd64.tar.gz"
          tar -xzf tfsec.tar.gz tfsec
          chmod +x tfsec
          echo "$(pwd)" >> $GITHUB_PATH
          ./tfsec --version
      
      # 3. Run tfsec security scan
      - name: Run tfsec security scan
        id: tfsec
        continue-on-error: true
        run: |
          cd ./terraform
          # Run tfsec and capture exit code
          set +e
          ../tfsec . \
            --minimum-severity critical \
            --format sarif \
            --out ../tfsec-results.sarif 2>&1
          TFSEC_EXIT_CODE=$?
          set -e
          
          cd ..
          # Check if SARIF file was created
          if [ -f ./tfsec-results.sarif ]; then
            echo "✅ tfsec scan completed, results file created"
            # Check for CRITICAL findings (error level in SARIF)
            if grep -q '"level":"error"' ./tfsec-results.sarif; then
              echo "❌ CRITICAL security issues found by tfsec!"
              exit 1
            elif [ $TFSEC_EXIT_CODE -ne 0 ]; then
              echo "❌ tfsec scan failed with exit code: $TFSEC_EXIT_CODE"
              exit 1
            else
              echo "✅ No CRITICAL security issues found by tfsec"
              exit 0
            fi
          else
            echo "⚠️ tfsec results file not created (exit code: $TFSEC_EXIT_CODE)"
            # If tfsec failed and no file was created, still fail
            if [ $TFSEC_EXIT_CODE -ne 0 ]; then
              echo "❌ tfsec scan failed"
              exit 1
            fi
            exit 0
          fi
      
      # 4. Check if tfsec results exist and upload
      - name: Check tfsec results file
        id: check_tfsec_file
        continue-on-error: true
        run: |
          if [ -f ./tfsec-results.sarif ]; then
            echo "file_exists=true" >> $GITHUB_OUTPUT
            echo "✅ tfsec results file found"
          else
            echo "file_exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ tfsec results file not found"
          fi
      
      # 5. Upload tfsec results to GitHub Security tab
      - name: Upload tfsec results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() && steps.check_tfsec_file.outputs.file_exists == 'true'
        with:
          sarif_file: 'tfsec-results.sarif'
          category: 'terraform-security-scan'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # 6. Install Checkov
      - name: Install Checkov
        run: |
          python3 -m pip install --upgrade pip
          pip install checkov
      
      # 7. Run Checkov security scan on Terraform
      - name: Run Checkov security scan
        id: checkov
        continue-on-error: true
        run: |
          # Run checkov and capture exit code
          set +e
          checkov -d ./terraform \
            --framework terraform \
            --output sarif \
            --output-file-path ./checkov-results.sarif \
            --quiet
          CHECKOV_EXIT_CODE=$?
          set -e
          
          # Check if SARIF file was created
          if [ -f ./checkov-results.sarif ]; then
            echo "✅ Checkov scan completed, results file created"
            # Check for CRITICAL severity issues (error level in SARIF)
            if grep -q '"level":"error"' ./checkov-results.sarif; then
              echo "❌ CRITICAL security issues found by Checkov!"
              exit 1
            elif [ $CHECKOV_EXIT_CODE -ne 0 ]; then
              echo "⚠️ Checkov found issues but none are CRITICAL"
              exit 0
            else
              echo "✅ No CRITICAL security issues found by Checkov"
            fi
          else
            echo "⚠️ Checkov results file not created"
            exit 0
          fi
      
      # 8. Check if Checkov results exist and upload
      - name: Check Checkov results file
        id: check_checkov_file
        continue-on-error: true
        run: |
          if [ -f ./checkov-results.sarif ]; then
            echo "file_exists=true" >> $GITHUB_OUTPUT
            echo "✅ Checkov results file found"
          else
            echo "file_exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ Checkov results file not found"
          fi
      
      # 9. Upload Checkov results to GitHub Security tab
      - name: Upload Checkov results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() && steps.check_checkov_file.outputs.file_exists == 'true'
        with:
          sarif_file: './checkov-results.sarif'
          category: 'terraform-checkov-scan'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # 10. Fail job if scans found CRITICAL vulnerabilities
      - name: Fail on critical vulnerabilities
        if: steps.tfsec.outcome == 'failure' || steps.checkov.outcome == 'failure'
        run: |
          echo "::error::Security scan detected CRITICAL vulnerabilities!"
          if [ "${{ steps.tfsec.outcome }}" == "failure" ]; then
            echo "::error::tfsec found CRITICAL issues"
          fi
          if [ "${{ steps.checkov.outcome }}" == "failure" ]; then
            echo "::error::Checkov found CRITICAL issues"
          fi
          exit 1

  # Docker Compose Build Job
  docker-compose:
    name: Docker Compose Build
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, iac-security-scan]
    
    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2. Build with Docker Compose
      - name: Build with Docker Compose
        run: docker compose build
      
      # 3. Set up backend .env files
      - name: Create backend .env
        run: |
          echo "JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}" > ./backend/.env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> ./backend/.env
          echo "FRONTEND_URL=${{ secrets.FRONTEND_URL }}" >> ./backend/.env
          echo "SEED_PASSWORD=${{ secrets.SEED_PASSWORD }}" >> ./backend/.env
          echo "PORT=${{ secrets.PORT }}" >> ./backend/.env
      # 4. Set up frontend .env files
      - name: Create frontend .env
        run: |
          echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" > ./frontend/.env
        
      # 5. Verify services start
      - name: Start services
        run: docker compose up -d
      
      # 6. Wait for services to be ready
      - name: Wait for services
        run: sleep 10
      
      # 7. Check services are running
      - name: Check services health
        run: docker compose ps
      
      # 8. Cleanup
      - name: Stop services
        run: docker compose down